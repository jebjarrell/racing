# Horse Racing Quantitative Betting System Configuration
# Version: 1.0
# Last Updated: 2025-12-16

# =============================================================================
# BETTING PARAMETERS
# =============================================================================
betting:
  # Kelly Criterion Settings
  fractional_kelly: 0.25          # Use quarter Kelly (25% of optimal)
                                  # Range: 0.10 - 0.50
                                  # Lower values reduce variance

  # Bet Selection Filters
  min_ev_threshold: 0.08          # Minimum expected value (8%)
                                  # Bets must have EV >= this threshold

  min_probability: 0.08           # Minimum model probability (8%)
                                  # Avoid extreme longshots

  min_overlay: 1.20               # Minimum overlay ratio
                                  # 1.20 means model_prob >= 1.2x market_prob
                                  # Equivalent to 20% edge

  max_odds: 15.0                  # Maximum odds to bet (15-1)
                                  # Avoid high-variance lottery tickets

  # Risk Limits
  max_per_race_pct: 0.02          # Maximum per-race exposure (2% of bankroll)
  daily_loss_limit_pct: 0.10      # Daily stop-loss (10% of bankroll)
  min_bet_amount: 2.0             # Minimum bet size (platform minimum)

# =============================================================================
# BANKROLL SETTINGS
# =============================================================================
bankroll:
  initial: 2000.0                 # Starting bankroll in USD
  currency: USD

  # Stake Recalculation
  recalculation_frequency: daily  # Options: daily, weekly, fixed

  # Drawdown Protection
  reduce_stakes_threshold: 0.20   # Reduce stakes by 50% if down 20%
  pause_threshold: 0.30           # Pause betting if down 30%

  # Growth Handling
  increase_stakes_threshold: 0.25 # Consider increasing if up 25%
  max_stake_multiplier: 2.0       # Never exceed 2x initial stakes

# =============================================================================
# TRACK CLASSIFICATIONS
# =============================================================================
tracks:
  # High-volume tracks with efficient markets
  high_volume:
    - CD    # Churchill Downs (Louisville, KY)
    - SAR   # Saratoga (Saratoga Springs, NY)
    - BEL   # Belmont (Elmont, NY)
    - GP    # Gulfstream Park (Hallandale Beach, FL)
    - SA    # Santa Anita (Arcadia, CA)
    - DMR   # Del Mar (Del Mar, CA)
    - KEE   # Keeneland (Lexington, KY)
    - AQU   # Aqueduct (Ozone Park, NY)

  # Regional tracks - potentially less efficient
  regional:
    - TP    # Turfway Park (Florence, KY)
    - CT    # Charles Town (Charles Town, WV)
    - PEN   # Penn National (Grantville, PA)
    - LRL   # Laurel Park (Laurel, MD)
    - TAM   # Tampa Bay Downs (Tampa, FL)
    - FG    # Fair Grounds (New Orleans, LA)
    - OP    # Oaklawn Park (Hot Springs, AR)
    - GG    # Golden Gate Fields (Berkeley, CA)
    - PRM   # Prairie Meadows (Altoona, IA)
    - IND   # Indiana Grand (Shelbyville, IN)

  # Tracks to exclude from betting
  excluded: []

# =============================================================================
# SPLIT TESTING CONFIGURATION
# =============================================================================
split_test:
  enabled: true                   # Enable A/B testing between track types

  allocation:
    high_volume: 0.50             # 50% of bankroll for high-volume tracks
    regional: 0.50                # 50% of bankroll for regional tracks

  # Statistical significance requirements
  min_bets_for_significance: 500  # Minimum bets per segment
  evaluation_period_days: 90      # Days before evaluating
  significance_level: 0.05        # p-value threshold

  # Decision thresholds
  roi_difference_threshold: 0.02  # 2% ROI difference triggers reallocation
  shift_amount: 0.20              # Shift 20% when significant diff found

# =============================================================================
# SENSITIVITY ANALYSIS
# =============================================================================
sensitivity:
  # Edge degradation scenarios (backtest to live)
  edge_degradation_scenarios:
    best_case: 0.20               # 20% degradation
    expected: 0.35                # 35% degradation (default assumption)
    worst_case: 0.55              # 55% degradation

  # Minimum backtest requirements
  min_backtest_roi: 0.05          # Require 5% backtest ROI before going live
  min_sample_size: 1000           # Minimum races in backtest

# =============================================================================
# MODEL PARAMETERS
# =============================================================================
model:
  algorithm: lightgbm

  hyperparameters:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    min_child_samples: 20
    num_leaves: 31

  training:
    early_stopping_rounds: 50
    random_state: 42
    n_jobs: -1
    verbose: -1

  calibration:
    method: isotonic              # Options: isotonic, platt
    field_size_stratification: true
    field_size_buckets:
      small: [5, 7]
      medium: [8, 10]
      large: [11, 20]

  # Data splits (time-based)
  splits:
    train:
      start: "2023-01-01"
      end: "2023-06-30"
    validation:
      start: "2023-07-01"
      end: "2023-09-30"
    test:
      start: "2023-10-01"
      end: "2023-12-31"

# =============================================================================
# FEATURE ENGINEERING
# =============================================================================
features:
  # Rolling window sizes (days)
  rolling_windows:
    - 14
    - 30
    - 60

  # Track bias calculation
  track_bias:
    min_sample_size: 50           # Minimum races for bias calculation
    distance_buckets:
      sprint: [0, 1540]           # < 7 furlongs
      route: [1540, 2200]         # 7f to < 1 mile
      marathon: [2200, 99999]     # >= 1 mile

  # Sample size thresholds for low-sample flags
  sample_size_thresholds:
    horse: 3
    trainer: 20
    jockey: 20
    combo: 5
    track_bias: 50

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
database:
  type: postgresql                # Options: postgresql, sqlite

  postgresql:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:racing_db}
    schema: racing
    pool_size: 10
    max_overflow: 20

  sqlite:
    path: racing_data.db          # For development/testing

  timescaledb:
    enabled: true
    chunk_time_interval: "7 days"

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  level: INFO                     # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  handlers:
    console:
      enabled: true
      level: INFO
    file:
      enabled: true
      level: DEBUG
      path: logs/racing.log
      max_bytes: 10485760         # 10MB
      backup_count: 5

# =============================================================================
# DASHBOARD CONFIGURATION
# =============================================================================
dashboard:
  host: 0.0.0.0
  port: 8501
  refresh_interval: 60            # Seconds between auto-refresh
  timezone: America/New_York      # Display timezone

  # Alert thresholds
  alerts:
    daily_loss_warning: 0.08      # Alert at 8% daily loss
    calibration_drift: 0.03       # Alert if ECE > 0.03
    drawdown_warning: 0.20        # Alert at 20% drawdown

# =============================================================================
# EXECUTION SETTINGS
# =============================================================================
execution:
  platform: twinspires            # Primary platform: twinspires or draftkings
  backup_platform: draftkings

  # Timing
  pre_race_refresh_minutes: 10    # Refresh odds X minutes before post
  min_time_to_post_minutes: 2     # Don't bet if less than 2 min to post

  # Scratch handling
  recompute_on_scratch: true      # Recompute predictions when scratch detected
  scratch_check_interval: 60      # Seconds between scratch checks

# =============================================================================
# MONITORING
# =============================================================================
monitoring:
  # Performance tracking
  performance:
    roi_periods:
      - 7                         # Last 7 days
      - 30                        # Last 30 days
      - 90                        # Last 90 days
      - all                       # All time

  # Calibration monitoring
  calibration:
    check_frequency: daily
    bins: 10
    alert_threshold: 0.03         # Alert if ECE exceeds this

  # Model health
  model_health:
    feature_importance_tracking: true
    prediction_logging: true
    drift_detection: true

# =============================================================================
# EXPERIMENT TRACKING (MLflow)
# =============================================================================
mlflow:
  tracking_uri: ${MLFLOW_TRACKING_URI:http://localhost:5000}
  experiment_name: racing_model
  artifact_location: mlruns/
